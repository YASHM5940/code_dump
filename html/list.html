<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- un ordered list -->
    <ul type="square">
        
        <li>home</li>
        <li>car1</li>
        <li>hiyu</li>
        <!-- we can alter the bullets using "type" tag -->
    </ul>
    <!-- now we learn table tag -->
    <table>
        <tr>
            <!-- table row tag. write all things in that row here -->
            <th>table header tag</th>
            <th>name   </th>
            <th>age  </th>
            <th>height  </th>
        </tr>
        <tr>
            <th>tag1</th>
            <th>hiyu</th>
            <th>34</th>
            <th>7 feet, 5 inch</th>

        </tr>
        <tr>
            <th>tag2</th>
            <th>billu</th>
            <th>25</th>
            <th>4 feet, 2 inch</th>
        </tr>
    </table>
    <!-- we can make many such tables as we want  -->
</body>
</html>
